<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
 <rect width="1400" height="720" fill="#f7f9fc"/>
 <text x="70" y="80" font-family="Segoe UI,Arial" font-size="40" font-weight="700" fill="#172033">VideoHoarder — Getting Started</text>
 <text x="70" y="120" font-family="Segoe UI,Arial" font-size="22" fill="#4a5568">A beginner-friendly path from source code to your first local library</text>
 <g font-family="Segoe UI,Arial">
  <rect x="70" y="180" rx="22" width="280" height="360" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="115" cy="225" r="28" fill="#2563eb"/><text x="106" y="235" font-size="28" font-weight="700" fill="white">1</text>
  <text x="90" y="290" font-size="28" font-weight="700" fill="#172033">Install</text>
  <text x="90" y="335" font-size="20" fill="#334155">• Python 3.12</text><text x="90" y="370" font-size="20" fill="#334155">• FFmpeg recommended</text><text x="90" y="405" font-size="20" fill="#334155">• pip install requirements</text>
  <text x="90" y="470" font-size="18" fill="#64748b">Open PowerShell in the</text><text x="90" y="496" font-size="18" fill="#64748b">VideoHoarder folder.</text>

  <rect x="395" y="180" rx="22" width="280" height="360" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="440" cy="225" r="28" fill="#2563eb"/><text x="431" y="235" font-size="28" font-weight="700" fill="white">2</text>
  <text x="415" y="290" font-size="28" font-weight="700" fill="#172033">Launch</text>
  <text x="415" y="345" font-size="20" fill="#334155">Run:</text><rect x="415" y="370" width="225" height="50" rx="8" fill="#111827"/><text x="430" y="403" font-size="18" fill="#e5e7eb">python run_gui.pyw</text>
  <text x="415" y="470" font-size="18" fill="#64748b">The desktop command</text><text x="415" y="496" font-size="18" fill="#64748b">centre opens locally.</text>

  <rect x="720" y="180" rx="22" width="280" height="360" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="765" cy="225" r="28" fill="#2563eb"/><text x="756" y="235" font-size="28" font-weight="700" fill="white">3</text>
  <text x="740" y="290" font-size="28" font-weight="700" fill="#172033">Add Videos</text>
  <text x="740" y="340" font-size="20" fill="#334155">Choose either:</text><text x="740" y="380" font-size="20" fill="#334155">• Import Local Videos</text><text x="740" y="415" font-size="20" fill="#334155">• Supported download flow</text>
  <text x="740" y="470" font-size="18" fill="#64748b">Preview first. “Leave in</text><text x="740" y="496" font-size="18" fill="#64748b">place” is safest.</text>

  <rect x="1045" y="180" rx="22" width="280" height="360" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="1090" cy="225" r="28" fill="#2563eb"/><text x="1081" y="235" font-size="28" font-weight="700" fill="white">4</text>
  <text x="1065" y="290" font-size="28" font-weight="700" fill="#172033">Review</text>
  <text x="1065" y="340" font-size="20" fill="#334155">Library → transcript →</text><text x="1065" y="375" font-size="20" fill="#334155">optional intelligence →</text><text x="1065" y="410" font-size="20" fill="#334155">human review</text>
  <text x="1065" y="470" font-size="18" fill="#64748b">AI never silently applies</text><text x="1065" y="496" font-size="18" fill="#64748b">changes to your library.</text>

  <path d="M350 360 L390 360" stroke="#2563eb" stroke-width="5" marker-end="url(#a)"/><path d="M675 360 L715 360" stroke="#2563eb" stroke-width="5" marker-end="url(#a)"/><path d="M1000 360 L1040 360" stroke="#2563eb" stroke-width="5" marker-end="url(#a)"/>
 </g>
 <defs><marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/></marker></defs>
 <rect x="70" y="590" width="1255" height="70" rx="14" fill="#e0f2fe"/><text x="95" y="634" font-family="Segoe UI,Arial" font-size="22" fill="#0c4a6e">Tip: No OpenAI key is required for normal local use. The API provider is optional and disabled by default.</text>
</svg>
