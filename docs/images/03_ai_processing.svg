<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
 <rect width="1400" height="760" fill="#f7f9fc"/>
 <text x="70" y="75" font-family="Segoe UI,Arial" font-size="40" font-weight="700" fill="#172033">Transcript Intelligence — Manual or Optional API</text>
 <text x="70" y="115" font-family="Segoe UI,Arial" font-size="21" fill="#475569">Both paths return through the same validation and human-review gate.</text>
 <defs><marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/></marker></defs>
 <g font-family="Segoe UI,Arial">
  <rect x="80" y="210" width="230" height="110" rx="18" fill="white" stroke="#94a3b8"/><circle cx="105" cy="235" r="20" fill="#2563eb"/><text x="99" y="243" fill="white" font-size="20" font-weight="700">1</text><text x="130" y="255" font-size="22" font-weight="700" fill="#172033">Transcript</text><text x="130" y="288" font-size="17" fill="#64748b">Canonical evidence</text>
  <path d="M310 265 L405 265" stroke="#2563eb" stroke-width="5" marker-end="url(#a)"/>
  <rect x="420" y="210" width="250" height="110" rx="18" fill="white" stroke="#94a3b8"/><circle cx="445" cy="235" r="20" fill="#2563eb"/><text x="439" y="243" fill="white" font-size="20" font-weight="700">2</text><text x="470" y="255" font-size="22" font-weight="700" fill="#172033">Package</text><text x="470" y="288" font-size="17" fill="#64748b">One video at a time</text>
  <path d="M670 265 L770 195" stroke="#2563eb" stroke-width="5" marker-end="url(#a)"/><path d="M670 265 L770 335" stroke="#2563eb" stroke-width="5" marker-end="url(#a)"/>
  <rect x="790" y="135" width="260" height="110" rx="18" fill="#ecfeff" stroke="#0891b2"/><circle cx="815" cy="160" r="20" fill="#0891b2"/><text x="809" y="168" fill="white" font-size="20" font-weight="700">3</text><text x="840" y="180" font-size="21" font-weight="700" fill="#164e63">Manual ChatGPT</text><text x="840" y="212" font-size="17" fill="#0e7490">File-first exchange</text>
  <rect x="790" y="295" width="260" height="110" rx="18" fill="#f0fdf4" stroke="#16a34a"/><circle cx="815" cy="320" r="20" fill="#16a34a"/><text x="809" y="328" fill="white" font-size="20" font-weight="700">3</text><text x="840" y="340" font-size="21" font-weight="700" fill="#14532d">OpenAI API</text><text x="840" y="372" font-size="17" fill="#15803d">Optional + disabled by default</text>
  <path d="M1050 190 L1135 265" stroke="#2563eb" stroke-width="5" marker-end="url(#a)"/><path d="M1050 350 L1135 275" stroke="#2563eb" stroke-width="5" marker-end="url(#a)"/>
  <rect x="1150" y="210" width="190" height="110" rx="18" fill="white" stroke="#94a3b8"/><circle cx="1175" cy="235" r="20" fill="#2563eb"/><text x="1169" y="243" fill="white" font-size="20" font-weight="700">4</text><text x="1200" y="255" font-size="21" font-weight="700" fill="#172033">Validate</text><text x="1200" y="288" font-size="17" fill="#64748b">Import checks</text>
  <path d="M1245 320 L1245 430" stroke="#2563eb" stroke-width="5" marker-end="url(#a)"/>
  <rect x="1085" y="450" width="320" height="120" rx="18" fill="#fff7ed" stroke="#f97316"/><circle cx="1110" cy="475" r="20" fill="#f97316"/><text x="1104" y="483" fill="white" font-size="20" font-weight="700">5</text><text x="1135" y="497" font-size="22" font-weight="700" fill="#9a3412">Human review</text><text x="1135" y="530" font-size="17" fill="#9a3412">Nothing applies automatically</text>
 </g>
 <rect x="80" y="620" width="1260" height="80" rx="14" fill="#e0f2fe"/><text x="105" y="655" font-family="Segoe UI,Arial" font-size="20" fill="#0c4a6e">Privacy defaults: no key in config • store=false • restricted videos blocked by default • API results remain NOT_APPLIED until reviewed.</text><text x="105" y="682" font-family="Segoe UI,Arial" font-size="18" fill="#0c4a6e">You can use VideoHoarder without OpenAI at all.</text>
</svg>
