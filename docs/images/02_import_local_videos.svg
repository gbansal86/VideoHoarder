<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
 <rect width="1400" height="820" fill="#f4f7fb"/>
 <text x="60" y="70" font-family="Segoe UI,Arial" font-size="40" font-weight="700" fill="#172033">Import Local Videos — Annotated Walkthrough</text>
 <rect x="60" y="120" width="1280" height="610" rx="18" fill="white" stroke="#cbd5e1" stroke-width="2"/>
 <rect x="60" y="120" width="270" height="610" rx="18" fill="#172033"/>
 <text x="95" y="180" font-family="Segoe UI,Arial" font-size="28" font-weight="700" fill="white">VideoHoarder</text>
 <g font-family="Segoe UI,Arial" font-size="21" fill="#cbd5e1"><text x="95" y="245">Dashboard</text><text x="95" y="295">Library</text><text x="95" y="345">Downloads</text><rect x="82" y="375" width="220" height="52" rx="10" fill="#2563eb"/><text x="98" y="409" fill="white" font-weight="700">Import Local Videos</text><text x="95" y="475">ChatGPT Processing</text><text x="95" y="525">Settings</text></g>
 <g font-family="Segoe UI,Arial">
  <text x="380" y="180" font-size="32" font-weight="700" fill="#172033">Import Local Videos</text>
  <circle cx="388" cy="234" r="23" fill="#2563eb"/><text x="380" y="243" font-size="23" font-weight="700" fill="white">1</text><text x="425" y="242" font-size="21" fill="#334155">Paste one file/folder path per line</text>
  <rect x="380" y="270" width="870" height="130" rx="10" fill="#f8fafc" stroke="#94a3b8"/><text x="405" y="310" font-size="19" fill="#475569">D:\Videos</text><text x="405" y="345" font-size="19" fill="#475569">E:\Courses\Lesson 1.mp4</text>
  <circle cx="388" cy="448" r="23" fill="#2563eb"/><text x="380" y="457" font-size="23" font-weight="700" fill="white">2</text><rect x="425" y="422" width="190" height="52" rx="10" fill="#0f766e"/><text x="451" y="456" font-size="20" font-weight="700" fill="white">Scan / Preview</text><text x="640" y="456" font-size="19" fill="#64748b">Read-only: nothing is moved yet.</text>
  <circle cx="388" cy="525" r="23" fill="#2563eb"/><text x="380" y="534" font-size="23" font-weight="700" fill="white">3</text><text x="425" y="534" font-size="21" fill="#334155">Choose storage mode</text>
  <rect x="425" y="560" width="220" height="70" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="454" y="590" font-size="20" font-weight="700" fill="#1e3a8a">● Leave in place</text><text x="454" y="615" font-size="16" fill="#1e3a8a">Recommended</text>
  <rect x="665" y="560" width="170" height="70" rx="12" fill="#f8fafc" stroke="#94a3b8"/><text x="720" y="602" font-size="20" fill="#334155">Copy</text>
  <rect x="855" y="560" width="170" height="70" rx="12" fill="#f8fafc" stroke="#94a3b8"/><text x="910" y="602" font-size="20" fill="#334155">Move</text>
  <circle cx="388" cy="677" r="23" fill="#2563eb"/><text x="380" y="686" font-size="23" font-weight="700" fill="white">4</text><rect x="425" y="650" width="260" height="54" rx="10" fill="#2563eb"/><text x="458" y="685" font-size="20" font-weight="700" fill="white">Import Selected Videos</text><text x="715" y="683" font-size="18" fill="#64748b">Re-import skips duplicates.</text>
 </g>
 <rect x="60" y="755" width="1280" height="45" rx="8" fill="#fff7ed"/><text x="82" y="785" font-family="Segoe UI,Arial" font-size="18" fill="#9a3412">Safety: “Move” requires a separate confirmation. Reference mode does not rename or modify your original video.</text>
</svg>
