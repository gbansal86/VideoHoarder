<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700">
 <rect width="1400" height="700" fill="#f7f9fc"/>
 <text x="70" y="75" font-family="Segoe UI,Arial" font-size="40" font-weight="700" fill="#172033">Public Repository Safety Boundary</text>
 <g font-family="Segoe UI,Arial">
  <rect x="70" y="135" width="580" height="470" rx="20" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="105" y="190" font-size="30" font-weight="700" fill="#166534">✓ Commit to GitHub</text>
  <text x="110" y="245" font-size="21" fill="#14532d">1. Application source: app/</text><text x="110" y="285" font-size="21" fill="#14532d">2. Automated tests: tests/</text><text x="110" y="325" font-size="21" fill="#14532d">3. Public documentation: docs/</text><text x="110" y="365" font-size="21" fill="#14532d">4. CI / CodeQL / issue templates</text><text x="110" y="405" font-size="21" fill="#14532d">5. config.example.json</text><text x="110" y="445" font-size="21" fill="#14532d">6. Synthetic fixtures only</text><text x="110" y="485" font-size="21" fill="#14532d">7. MIT LICENSE + contributor docs</text>
  <rect x="750" y="135" width="580" height="470" rx="20" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="785" y="190" font-size="30" font-weight="700" fill="#991b1b">✗ Never commit</text>
  <text x="790" y="245" font-size="21" fill="#7f1d1d">1. exchange/ processing packages</text><text x="790" y="285" font-size="21" fill="#7f1d1d">2. CHATGPT_PACKAGE / RESULT files</text><text x="790" y="325" font-size="21" fill="#7f1d1d">3. Real transcripts / subtitles</text><text x="790" y="365" font-size="21" fill="#7f1d1d">4. SQLite databases / downloaded media</text><text x="790" y="405" font-size="21" fill="#7f1d1d">5. API keys, cookies, OAuth tokens</text><text x="790" y="445" font-size="21" fill="#7f1d1d">6. Live config.json / session files</text><text x="790" y="485" font-size="21" fill="#7f1d1d">7. Generated private intelligence reports</text>
 </g>
 <rect x="70" y="630" width="1260" height="45" rx="8" fill="#fff7ed"/><text x="92" y="660" font-family="Segoe UI,Arial" font-size="18" fill="#9a3412">Run scripts/public_release_audit.py before every public release. The CI workflow runs the same preflight automatically.</text>
</svg>
