name: Dependency Security

on:
  pull_request:
    paths:
      - "requirements.txt"
      - "requirements-build.txt"
      - ".github/workflows/dependency-security.yml"
  push:
    branches: [main]
    paths:
      - "requirements.txt"
      - "requirements-build.txt"
      - ".github/workflows/dependency-security.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install audit tooling
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit dependencies and generate CycloneDX SBOM
        shell: bash
        run: |
          set +e
          python -m pip_audit -r requirements.txt --strict --progress-spinner off -f json -o dependency-audit.json
          audit_status=$?
          python -m pip_audit -r requirements.txt --strict --progress-spinner off -f cyclonedx-json -o sbom.cdx.json
          sbom_status=$?
          echo "AUDIT_STATUS=$audit_status" >> "$GITHUB_ENV"
          echo "SBOM_STATUS=$sbom_status" >> "$GITHUB_ENV"
          exit 0

      - name: Upload dependency security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VideoHoarder-dependency-security
          path: |
            dependency-audit.json
            sbom.cdx.json
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce dependency audit
        shell: bash
        run: |
          if [ "$AUDIT_STATUS" -ne 0 ] || [ "$SBOM_STATUS" -ne 0 ]; then
            echo "pip-audit reported a vulnerability or dependency-resolution failure."
            exit 1
          fi
