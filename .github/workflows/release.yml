name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/windows-build.yml
    permissions:
      contents: read

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Validate tag matches application version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < app/VERSION.txt)"
          base_version="${version%-GUI}"
          expected_tag="v${base_version}"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match app/VERSION.txt ($expected_tag)."
            exit 1
          fi

      - name: Download validated Windows build
        uses: actions/download-artifact@v5
        with:
          name: VideoHoarder-Windows-CI
          path: release-artifact

      - name: Record release asset checksum
        shell: bash
        run: |
          sha256sum release-artifact/*.zip | tee release-artifact/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME"             release-artifact/*.zip             release-artifact/SHA256SUMS.txt             --verify-tag             --generate-notes             --title "VideoHoarder $GITHUB_REF_NAME"
